<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipperie — Un live de deux heures devient trente clips verticaux</title>
<meta name="description" content="Dépose ton podcast, ton live ou ta formation. Clipperie le découpe en clips verticaux sous-titrés, prêts à publier. Bientôt disponible.">
<meta property="og:type" content="website">
<meta property="og:locale" content="fr_FR">
<meta property="og:title" content="Clipperie — Un live de deux heures devient trente clips verticaux">
<meta property="og:description" content="Fini la journée de découpage. Clips verticaux sous-titrés, prêts à publier. Bientôt disponible.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --encre:#14213D; --orange:#E4572E; --creme:#FAF6EF; }
  * { box-sizing:border-box; margin:0; }
  body {
    min-height:100svh; background:var(--creme); color:var(--encre);
    font-family:'Instrument Sans',system-ui,sans-serif; font-size:18px; line-height:1.5;
    display:flex; flex-direction:column; justify-content:space-between; padding:28px 20px;
  }
  .logo { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:22px; letter-spacing:-0.02em; }
  .logo span { color:var(--orange); }
  main { max-width:560px; }
  h1 {
    font-family:'Bricolage Grotesque',sans-serif; font-weight:800;
    font-size:clamp(38px,11vw,64px); line-height:1.02; letter-spacing:-0.03em; margin-bottom:20px;
  }
  h1 em { font-style:normal; color:var(--orange); }
  p { max-width:46ch; margin-bottom:28px; }
  .badge {
    display:inline-block; background:var(--encre); color:var(--creme);
    padding:14px 22px; border-radius:14px; font-weight:600;
    box-shadow:4px 4px 0 var(--orange);
  }
  footer { font-size:14px; opacity:.7; }
</style>
</head>
<body>
  <div class="logo">Clipperie<span>.</span></div>
  <main>
    <h1>Un live de deux heures devient <em>trente clips</em> verticaux.</h1>
    <p>Dépose ton podcast, ton stream ou ta formation. Clipperie repère les meilleurs moments, les découpe et les sous-titre. Tu publies.</p>
    <span class="badge">Ouverture très bientôt</span>
  </main>
  <footer>© Clipperie</footer>
</body>
</html>
